name: Day 17 - Deploy Angular frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "day-17/deploy-to-azure-static-web-apps/frontend/**"
      - ".github/workflows/day17-azure-static-web-apps.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "day-17/deploy-to-azure-static-web-apps/frontend/**"

# No client secret, no API key, and no Azure credentials of any kind live in
# this file. AZURE_STATIC_WEB_APPS_API_TOKEN_QUOTES_STORE_DAY17 is a
# write-only SWA *deployment* token (it can only push static files to this
# one Static Web App) stored in GitHub Actions secrets — it is not an Azure
# AD client secret, not an API key for the Week-1 QuotesApi, and grants no
# access to any data. See day-17/deploy-to-azure-static-web-apps/
# deployment-brief.md for the full authentication/Managed Identity model.

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: day-17/deploy-to-azure-static-web-apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: day-17/deploy-to-azure-static-web-apps/frontend
        run: npm ci

      - name: Run unit tests
        working-directory: day-17/deploy-to-azure-static-web-apps/frontend
        run: npm test -- --watch=false

      - name: Build (production)
        working-directory: day-17/deploy-to-azure-static-web-apps/frontend
        run: npm run build -- --configuration production

      - name: Fail if any secret-shaped string leaked into the build output
        working-directory: day-17/deploy-to-azure-static-web-apps/frontend
        run: |
          if grep -RIlE "client_secret|client secret|api[_-]?key|connection string" dist/quotes-store-app/browser; then
            echo "::error::Possible secret found in build output — see matched file(s) above."
            exit 1
          fi
          echo "No secret-shaped strings found in the production bundle."

      - name: Deploy to Azure Static Web Apps
        if: github.event_name == 'push' || github.event.action != 'closed'
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_QUOTES_STORE_DAY17 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "day-17/deploy-to-azure-static-web-apps/frontend"
          output_location: "dist/quotes-store-app/browser"
          skip_app_build: true
          app_build_command: "true"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_QUOTES_STORE_DAY17 }}
          action: "close"
